events {
    worker_connections 1024;
}

http {
    # ========== RATE LIMITING ==========
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ========== UPSTREAMS ==========
    upstream backend {
        server backend:5000 max_fails=3 fail_timeout=30s;
    }

    upstream website {
        server website:3000 max_fails=3 fail_timeout=30s;
    }

    # ========== SERVER ==========
    server {
        listen 80;
        server_name medsathu.inn www.medsathu.inn api.medsathu.inn;
        
        # Redirect HTTP → HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name medsathu.inn www.medsathu.inn;

        # ========== SSL CERTIFICATES ==========
        ssl_certificate /etc/nginx/ssl/medsathu.crt;
        ssl_certificate_key /etc/nginx/ssl/medsathu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ========== SECURITY HEADERS ==========
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.razorpay.com https://checkout.razorpay.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://api.stripe.com https://api.medsathu.inn; font-src 'self' data:; frame-src https://checkout.razorpay.com https://js.stripe.com;" always;

        # ========== WEBSITE ==========
        location / {
            proxy_pass http://website;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== API ==========
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 100;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # ========== UPLOADS ==========
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== WEBSOCKETS (Socket.io) ==========
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== HEALTH CHECK ==========
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ========== API SUBDOMAIN ==========
    server {
        listen 443 ssl http2;
        server_name api.medsathu.inn;

        ssl_certificate /etc/nginx/ssl/api.medsathu.crt;
        ssl_certificate_key /etc/nginx/ssl/api.medsathu.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 100;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}